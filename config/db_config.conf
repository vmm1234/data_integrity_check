# ============================================================================
# Database Configuration for Data Integrity Check
# ============================================================================
# This file contains connection details for both source and target databases.
# Update these values to match your environment.
# ============================================================================

# Source Database Connection
SOURCE_DB_USER="test"
SOURCE_DB_PASSWORD="1234"
SOURCE_DB_HOST="localhost"
SOURCE_DB_PORT="1521"
SOURCE_DB_SERVICE="xe"

# Target Database Connection
TARGET_DB_USER="test"
TARGET_DB_PASSWORD="1234"
TARGET_DB_HOST="localhost"
TARGET_DB_PORT="1521"
TARGET_DB_SERVICE="xe"

# Preferred CLI tool: sqlplus, sqlcl, or "" for auto-detect
# sqlplus = Oracle SQL*Plus
# sqlcl   = Oracle SQLcl (command is 'sql')
# ""      = Auto-detect (tries sqlplus first, then sqlcl)
DB_CLI_TOOL=""

# SQL*Plus Path (only used if DB_CLI_TOOL="sqlplus" and not in PATH)
SQLPLUS_PATH="sqlplus"

# SQLcl Path (only used if DB_CLI_TOOL="sqlcl" and not in PATH)
SQLCL_PATH="sql"
